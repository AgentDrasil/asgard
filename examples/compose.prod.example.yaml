services:
  asgard:
    image: ghcr.io/agentdrasil/asgard:main
    container_name: asgard-prod
    hostname: asgard-host
    volumes:
      # All Asgard state (config, agents, logs, data, SQLite db) lives here.
      - ./asgard:/home/user/asgard
      - ~/src:/home/user/src
      - ./ssh:/home/user/.ssh:ro
    privileged: true
    restart: always
    ports:
      - "7000:7000"
