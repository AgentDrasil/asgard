services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: asgard-etcd
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --data-dir=/etcd-data
    volumes:
      - ./etcd-data:/etcd-data
    restart: always

  asgard:
    image: ghcr.io/agentdrasil/asgard-backend:main
    container_name: asgard-prod
    hostname: backend
    networks:
      default:
        # The runner dials backend:9311; compose DNS resolves aliases, not hostname.
        aliases:
          - backend
    environment:
      # Agent definitions and shared config live in etcd.
      - ETCD_ENDPOINTS=http://etcd:2379
    volumes:
      # Backend state (config incl. runner section, logs, SQLite db).
      - ./asgard:/asgard
      # Server certificate/key and the CA verifying runner certificates.
      - ./certs:/certs:ro
      # Backend keeps local host SSH mount for server-side git operations:
      - ./ssh:/home/user/.ssh:ro
    restart: always
    ports:
      - "7000:7000"
    # Runners reach the backend on runner.registry_port (default 9311) inside
    # the compose network; publish it only for runners on other machines.

  runner:
    image: ghcr.io/agentdrasil/asgard-runner:main
    container_name: asgard-runner-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
    # bubblewrap needs unprivileged user namespaces.
    security_opt:
      - seccomp=unconfined
      # Uncomment where AppArmor restricts user namespaces:
      # - apparmor=unconfined
    command:
      - -backend
      - backend:9311
    volumes:
      # Fixed TLS mount: runner expects /certs/tls.crt, /certs/tls.key, /certs/ca.crt.
      - ./certs:/certs:ro
      # Agent definitions and cache:
      - ./runner-asgard:/asgard
      # Per-session scratch and persistent data, logs:
      - ./session-data:/session-data
      # Workspaces mounted under /data:
      - ~/src:/data/src
      # SSH credentials are delivered via etcd credentials/ssh/ (no host mount required).
      # - ./ssh:/home/user/.ssh:ro
    restart: always
