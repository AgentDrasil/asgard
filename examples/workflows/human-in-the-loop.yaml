name: human-in-the-loop-workflow

nodes:
  # 1. Architecture / Plan Agent
  - id: planner_agent
    type: agent
    agent_id: agy-planner

  # 2. Human Review Gateway (Suspends workflow until user responds via WebUI/A2A)
  - id: plan_approval
    type: human
    depends:
      - node: planner_agent
    prompt: "Please review the generated plan file ${tmp_dir}/plan.md and choose Approve or Reject"
    options: ["Approve", "Reject"]
    output_file: "user_feedback.md"

  # 3. LLM Intent Classifier (Normalizes free-text user feedback into standard APPROVED / REJECTED tags)
  - id: classify_feedback
    type: llm
    depends:
      - node: plan_approval
    model: gemini-2.5-flash
    prompt: |
      The user replied to the plan: "${nodes.plan_approval.output}"
      Determine whether the user approved or rejected. Output only APPROVED or REJECTED.

  # 4. Code Execution Agent (Triggered only when approved)
  - id: executor_agent
    type: agent
    depends:
      - node: classify_feedback
        when: "nodes.classify_feedback.output == 'APPROVED'"
    agent_id: agy-coder
    session_policy: inherit
