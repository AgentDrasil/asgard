name: parallel-review-workflow

nodes:
  # 1. Security Review Agent
  - id: sec_reviewer
    type: agent
    agent_id: agy-reviewer
    entry: true

  # 2. Performance Review Agent (Executes concurrently with sec_reviewer)
  - id: perf_reviewer
    type: agent
    agent_id: agy-reviewer
    entry: true

  # 3. Consolidated Summary (Fork-Join aggregate node)
  - id: final_summary
    type: llm
    depends:
      - node: sec_reviewer
      - node: perf_reviewer
    join: always
    model: gemini-2.5-flash
    prompt: |
      Consolidate the security review report (${tmp_dir}/sec_review.txt) and performance review report (${tmp_dir}/perf_review.txt) to generate a comprehensive Code Review summary.
